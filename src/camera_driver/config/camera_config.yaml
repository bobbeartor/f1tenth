camera_driver:
  ros__parameters:
    enabled: true

    # OV9782 THE_720_P sensor mode: 1280x720, up to 143 FPS, 2 MIPI lanes.
    sensor_fps: 120.0
    width: 1280
    height: 720

    camera_socket: "CAM_A"
    # THE_720_P is already a 16:9 sensor crop, so no aspect-ratio change occurs.
    resize_mode: "CROP"

    # Runs inside the OAK/DepthAI pipeline, not with host-side cv::remap().
    undistort_enabled: true

    # Eight non-blocking slots sustain 120 FPS without stalling capture.
    queue_size: 8
    queue_blocking: false

    frame_id: "camera_optical_frame"
    # Raw NV12: Y plane followed by interleaved UV plane.
    image_topic: "/camera/image_rect"

    # IMU 토픽 발행 옵션이다. 통합 BEV launch는 토픽을 사용하지 않아 false로
    # 유지하지만, 영상 안정화에는 아래 IMU 스트림이 내부적으로 사용된다.
    imu_bridge_enabled: false
    imu_topic: "/camera/imu"
    imu_frame_id: "camera_optical_frame"
    # Raw accelerometer+gyroscope synchronized output maximum.
    imu_rate_hz: 400.0
    imu_queue_size: 80

    # 호스트 IMU 영상 안정화. 통합 BEV launch가 true로 덮어쓰며 영상 timestamp의
    # 고주파 roll/pitch 흔들림을 보정한다. BEV LUT는 시작 측정 후 고정된다.
    imu_stabilization_enabled: false
    imu_stabilization_warmup_samples: 400
    imu_stabilization_acceleration_time_constant_sec: 2.2
    imu_stabilization_acceleration_gate_deg: 8.0
    imu_stabilization_smoothing_time_constant_sec: 0.6
    imu_stabilization_maximum_correction_deg: 4.0
    # Change a gain to -1.0 only if a hardware-axis validation shows inversion.
    imu_stabilization_roll_gain: 1.0
    imu_stabilization_pitch_gain: 1.0

    # Keep the full stabilized frame. Optional NV12 cropping requires an even
    # pixel value.
    output_crop_top_px: 0

    # Disabled by default while measuring direct camera performance.
    publish_enabled: false
    publish_fps: 120.0

    # 독립 프리뷰는 CPU에서 NV12를 BGR로 바꾼다. 통합 BEV launch에서는 끄고
    # 작은 GPU BEV 결과만 프리뷰한다.
    preview_enabled: false
    preview_fps: 60.0
    preview_window_name: "OAK rectified image"
    preview_max_width: 1280
    preview_max_height: 720
    # Draw a subtle source-image coordinate grid on the standalone preview.
    preview_grid_enabled: true
    preview_grid_spacing_px: 20

    startup_timeout_sec: 5.0
    status_log_interval_sec: 5.0
