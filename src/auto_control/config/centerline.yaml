centerline_node:
  ros__parameters:
    image_topic: "/lane_mask"
    force_lane_mask_input: true
    debug_background_topic: "/camera/image_rect"

    steering_topic: "/auto/steering"       # -1.0=left, +1.0=right
    throttle_topic: "/auto/throttle"
    confidence_topic: "/auto/lane_confidence"
    status_topic: "/auto/status"
    debug_image_topic: "/auto/lane_debug"
    debug_mask_topic: "/auto/lane_mask"
    duty_topic: "/vesc/duty"
    servo_position_topic: "/vesc/servo_position"
    connection_status_topic: "/vesc/connected"

    # VESC output stays disabled until explicitly armed.
    drive_enabled: false
    publish_to_vesc: true
    require_vesc_connection: true
    publish_debug: false
    control_rate_hz: 100.0
    status_log_rate_hz: 2.0
    image_timeout_sec: 0.15

    # Use y=50..74 and exclude the bottom 25 rows (y=75..99), occupied by
    # the wheels/body.
    processing_width: 160
    processing_height: 100
    roi_y_min: 50
    roi_y_max: 74
    white_threshold: 127
    morphology_kernel: 3
    minimum_points_per_boundary: 8
    tracking_margin_px: 22.0
    # Preserve boundary identity for short mask dropouts. At about 28 FPS,
    # eight frames retain the same physical curve for roughly 0.3 seconds.
    tracking_memory_frames: 8
    # Search this many rows upward from the ROI bottom for the connected-path
    # seed. Unlike row runs, connected tracing also follows near-horizontal
    # sections of a sharp curve.
    trace_seed_search_rows: 12
    # Recenter ordinary thin runs, but keep the graph entry point for longer
    # near-horizontal runs instead of rejecting or averaging across them.
    trace_centering_max_run_width: 12
    # Reject thick mask blobs using rotation-invariant distance to the
    # component edge. Real lane strokes measured below 3 px; background blobs
    # in the recorded failure exceeded 7 px.
    maximum_component_half_thickness_px: 4.0
    # A lane is an elongated ribbon even through a 90-degree curve. Compact,
    # jagged mask blobs have similar spread in both axes and are rejected.
    minimum_component_elongation_ratio: 10.0

    # New camera calibration: expected full lane width at three screen rows.
    # Values are normalized by image height/width and are fitted as a quadratic
    # perspective profile. When only one boundary exists, half of this profile
    # reconstructs the centerline. Valid two-boundary frames refine it online.
    expected_lane_width_y_ratios: [0.50, 0.60, 0.70]
    expected_lane_width_ratios: [0.297, 0.469, 0.641]
    # Curves and camera-edge clipping can change the apparent distance between
    # two visible boundaries substantially. Keep the pair gate permissive while
    # continuity and curve-fit checks reject unrelated white floor features.
    lane_width_minimum_scale: 0.45
    lane_width_maximum_scale: 1.60
    maximum_fit_residual_px: 3.5
    lane_width_learning_alpha: 0.15
    single_lane_confidence_scale: 0.78

    # A centerline is extrapolated at most five rows beyond the actually
    # observed connected boundary.
    maximum_extrapolation_rows: 5

    # With one visible boundary, reconstruct the center using the boundary's
    # local normal projection. Curvature can enlarge the calibrated half-width,
    # but the total enlargement is capped for steering stability.
    single_lane_curvature_gain: 6.0
    single_lane_maximum_offset_scale: 1.30
    # LEFT_ONLY permits only right curvature; RIGHT_ONLY permits only left
    # curvature. Opposite curvature is replaced by the near-field tangent.
    single_lane_direction_guard_enabled: true
    # Allow only tiny quadratic-fit noise around a perfectly straight line.
    single_lane_convexity_tolerance: 0.002

    # Steering uses only the fitted quadratic centerline x(y). Increase the
    # cross-track gain as the vehicle gets farther from the centerline so large
    # errors in a curve receive stronger correction without amplifying small
    # near-center errors as much.
    lookahead_y: 68
    cross_track_gain: 0.90
    cross_track_error_boost_gain: 2.00
    preview_gain: 1.40
    derivative_gain: 0.025
    steering_deadband: 0.015
    steering_filter_alpha: 0.45
    maximum_steering_rate_per_sec: 4.0
    minimum_confidence: 0.45

    base_duty: 0.055
    minimum_duty: 0.050
    steering_slowdown: 0.55

    # Require a stable lane before moving, then briefly overcome static
    # friction at 0.06 and return smoothly to the controller's requested duty.
    # A short lane flicker stops the motor immediately but does not repeat the
    # boost; remaining stopped for rearm_stop_sec prepares a new start.
    startup_boost_duty: 0.060
    startup_boost_duration_sec: 0.20
    startup_ramp_down_sec: 0.10
    startup_stable_tracking_sec: 0.20
    startup_rearm_stop_sec: 0.50

    servo_left: 0.02
    servo_center: 0.46
    servo_right: 0.98
