joy_params_converter_node:
  ros__parameters:
    # RB 버튼은 누르는 즉시 한 번 처리하고, 이 시간 안의 접점 바운스만 무시한다.
    # 값을 너무 크게 잡으면 빠르게 두 번 누르는 정상 입력도 무시될 수 있다.
    button_debounce_sec: 0.15

actuator_commander_node:
  ros__parameters:
    accelerator_topic: "/manual/accelerator"       # RT, std_msgs/msg/Float32, 0.0 ~ 1.0
    brake_topic: "/manual/brake"                   # LT, std_msgs/msg/Float32, 0.0 ~ 1.0
    steering_topic: "/manual/steering"             # 왼쪽 스틱 X, -1.0 ~ 1.0
    gear_toggle_topic: "/manual/gear_toggle"       # RB 버튼, std_msgs/msg/Bool
    current_duty_topic: "/manual/current_duty"     # 현재 duty 명령
    gear_state_topic: "/manual/gear"               # FORWARD 또는 REVERSE
    duty_topic: "/vesc/duty"
    servo_position_topic: "/vesc/servo_position"

    forward_max_duty: 0.10
    reverse_max_duty: 0.08
    start_duty: 0.05                    # 전진 RT 입력 시 즉시 적용
    reverse_start_duty: 0.05            # 후진 RT 입력 시 -0.05 적용
    acceleration_duty_per_sec: 0.03     # 최대 전진 duty까지 약 1.7초
    # immediate_stop_on_accelerator_release=false일 때만 사용하는 자연 감속률
    coast_deceleration_duty_per_sec: 0.04
    brake_duty_per_sec: 0.08
    control_rate_hz: 80.0
    status_log_rate_hz: 2.0
    input_timeout_sec: 0.30
    # true: RT를 놓으면 다음 제어 주기(80 Hz)에서 duty를 즉시 0으로 만든다.
    # false: 아래 coast_deceleration_duty_per_sec 속도로 천천히 0까지 줄인다.
    immediate_stop_on_accelerator_release: false

    servo_left: 0.98
    servo_center: 0.46
    servo_right: 0.02
    pedal_deadzone: 0.01
    steering_deadzone: 0.04
