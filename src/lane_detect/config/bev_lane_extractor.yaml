bev_lane_extractor:
  ros__parameters:
    enabled: true
    input_topic: "/camera/image_bev"
    mask_topic: "/camera/image_bev_lane"
    debug_topic: "/camera/image_bev_lane_debug"
    path_topic: "/lane_center_path"
    output_frame_id: "front_axle_bev"

    # Must match bev_override.yaml. The extractor validates both the message
    # size and the metric bounds so a stale BEV configuration fails loudly.
    input_width: 200
    input_height: 190
    x_min_m: 0.10
    x_max_m: 2.0
    y_min_m: -1.0
    y_max_m: 1.0
    meter_per_pixel: 0.01

    # BEV is a warped black/white lane mask. Threshold once, then close only
    # in the forward direction to bridge short interpolation gaps without
    # joining the left and right lanes.
    white_threshold: 160
    vertical_close_m: 0.05

    # Real tape stays narrow and nearly distance-invariant in BEV. A mat edge
    # produces a very long horizontal run, so reject each row segment wider
    # than 18 cm before tracking.
    minimum_lane_mark_width_m: 0.01
    maximum_lane_mark_width_m: 0.18
    row_step_px: 2

    # Straight/curve track width is 0.60-0.65 m. The first real-car pass uses
    # a wider +/-0.20 m acquisition tolerance because the current screenshot
    # shows an apparent 0.45-0.50 m separation near the car; the measured
    # width is logged so this can be tightened after collecting curves.
    expected_lane_width_m: 0.625
    lane_width_tolerance_m: 0.20
    initial_center_tolerance_m: 0.45
    single_lane_initial_tolerance_m: 0.20

    # Follow rows from near to far. Briefly missing one boundary is allowed;
    # the surviving boundary still yields a centerline using half lane width.
    maximum_lateral_step_m: 0.08
    maximum_tracking_gap_rows: 20
    minimum_points_per_lane: 15
    maximum_fit_residual_m: 0.06
    allow_single_lane: true

    # Publish the controller-facing center path from near to far in the
    # front_axle_bev frame. Five-centimetre samples are sufficient for later
    # Pure Pursuit while keeping the message compact.
    path_minimum_x_m: 0.20
    path_maximum_x_m: 1.80
    path_step_m: 0.05
    output_line_thickness_m: 0.04

    preview_enabled: false
    preview_window_name: "BEV lane extraction"
    preview_scale: 3
    status_log_interval_sec: 5.0
