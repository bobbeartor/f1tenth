bev_processor_manual:
  ros__parameters:
    # lane_mask publishes the NV12 lane-only stream consumed by manual BEV.
    input_topic: "/camera/image_lane"

    x_min_m: 0.10

    # At 2.5 m one source pixel covers about 6.6 cm of ground, much larger
    # than the 1 cm BEV grid. Past 2.0 m the warp therefore magnifies blur
    # rather than adding useful lane information.
    x_max_m: 2.0

    # With a 1.0 m curve-center radius, the lane leaves the former +/-0.5 m
    # range from about 0.87 m forward. Widening the lateral range preserves
    # useful look-ahead on curves.
    y_min_m: -1.0
    y_max_m: 1.0

    meter_per_pixel: 0.01

    # Keep these dimensions synchronized with the bounds and resolution:
    # width  = (y_max_m - y_min_m) / meter_per_pixel = 200
    # height = (x_max_m - x_min_m) / meter_per_pixel = 190
    # bev_processor rejects the configuration when either value disagrees.
    output_width: 200
    output_height: 190
