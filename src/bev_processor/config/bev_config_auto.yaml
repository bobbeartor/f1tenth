bev_processor_auto:
  ros__parameters:
    # Required execution profile. The node rejects a missing/mismatched file.
    processor_mode: "auto"

    # camera_driver publishes rectified CAM_A frames in raw NV12 layout.
    input_topic: "/camera/image_rect"
    output_topic: "/camera/image_bev"
    output_frame_id: "front_axle_bev"
    expected_input_fps: 120.0

    # Every accepted input is processed on CUDA. Publishing is unlimited by
    # default, while the independent OpenCV preview is limited to 30 FPS.
    publish_enabled: true
    publish_max_fps: 0.0
    preview_enabled: true
    preview_max_fps: 30.0
    preview_window_name: "BEV image"
    preview_max_width: 1280
    preview_max_height: 720

    # camera_driver stabilizes the full 1280x720 frame, then crops its top
    # 250 rows. Cropping preserves fx/fy/cx and shifts cy by -250 pixels.
    input_width: 1280
    input_height: 470
    fx: 561.400939941
    fy: 561.136352539
    cx: 643.032653809
    cy: 102.621124268

    # Vehicle coordinates: origin=front-axle ground center,
    # +X=forward, +Y=left, +Z=up.
    # X/Y and yaw are fixed mounting values. Height/roll/downward pitch below
    # are nominal values; auto mode replaces them with a one-shot stereo
    # ground-plane fit before building the BEV LUT.
    camera_x_m: 0.0
    camera_y_m: 0.0
    camera_z_m: 0.17
    camera_roll_deg: 0.0
    camera_downward_pitch_deg: 13.0
    camera_yaw_deg: 0.0

    # Use only the NV12 Y plane. CUDA applies bicubic BEV interpolation,
    # contrast, binary thresholding, then morphology closing.
    grayscale_contrast_gain: 1.8
    grayscale_contrast_center: 128.0
    grayscale_brightness_offset: 0.0
    grayscale_binary_threshold: 170
    # Must be odd. At 0.01 m/pixel, 3 closes gaps up to roughly 3 cm.
    grayscale_closing_kernel_size: 3

    # Height/roll/pitch remain fixed at the startup stereo-plane measurement.
    # The camera driver already applies IMU roll/pitch stabilization before
    # cropping, so LUT attitude updates must stay off to avoid double correction.
    #
    # The parameters below are retained for optional experiments with camera
    # stabilization disabled.
    realtime_attitude_enabled: false
    realtime_imu_topic: "/camera/imu"
    realtime_attitude_update_hz: 120.0
    realtime_imu_minimum_acceleration_mps2: 7.5
    realtime_imu_maximum_acceleration_mps2: 12.0
    realtime_imu_acceleration_correction_time_constant_sec: 1.5
    realtime_imu_acceleration_correction_gate_deg: 8.0
    realtime_imu_maximum_sample_interval_sec: 0.1
    realtime_attitude_maximum_delta_deg: 15.0
    realtime_attitude_minimum_update_deg: 0.02
    realtime_imu_stale_timeout_sec: 0.5

    # One-shot startup measurement. Depth road points determine height, roll,
    # and pitch. IMU is used only to verify that the vehicle is stationary and
    # that the fitted plane normal has a physically plausible direction.
    # Keep the vehicle stationary while this center ROI sees unobstructed,
    # locally flat road.
    measurement_stereo_fps: 30.0
    measurement_stereo_width: 640
    measurement_stereo_height: 400
    measurement_depth_queue_size: 2
    measurement_imu_rate_hz: 400.0
    # Discard initial sensor transients, then average two seconds of IMU data.
    measurement_imu_queue_size: 200
    measurement_warmup_sec: 1.0
    # Pro-series IR dot projector adds texture to low-detail road surfaces.
    # Range is 0.0-1.0; 0.0 disables it. Use full intensity during the
    # one-shot measurement to maximize stereo features.
    measurement_ir_dot_projector_intensity: 1.0
    # 5/7 of the previous 320x160 ROI, rounded to even pixel dimensions.
    measurement_roi_width: 228
    measurement_roi_height: 114
    measurement_point_sample_step: 2
    # Keep the minimum-count ratios aligned with the smaller sampled ROI.
    measurement_minimum_valid_points: 1270
    measurement_minimum_depth_m: 0.30
    measurement_maximum_depth_m: 3.00
    measurement_minimum_height_m: 0.10
    measurement_maximum_height_m: 1.00

    # Per-frame robust plane fit and spatial quality checks.
    measurement_plane_ransac_iterations: 200
    measurement_plane_inlier_threshold_m: 0.008
    measurement_plane_minimum_inliers: 914
    measurement_plane_minimum_inlier_ratio: 0.70
    measurement_plane_maximum_residual_mad_m: 0.005
    # Absolute safety bound used while finding a plausible ground plane.
    measurement_plane_maximum_imu_difference_deg: 15.0

    # IMU reports minus true camera attitude. Leave at zero until a repeatable
    # bias has been measured on known-flat ground. Example: IMU=18.8deg and
    # trusted plane=13.0deg means pitch_bias=+5.8deg.
    measurement_imu_roll_bias_deg: 0.0
    measurement_imu_pitch_bias_deg: 0.0

    # Adaptive normal fusion. Random RMS and these systematic uncertainty
    # floors form inverse-variance weights. The larger default IMU floor keeps
    # the road plane dominant until the IMU mounting bias is calibrated. Only
    # after repeatable calibration should the IMU floor be reduced.
    measurement_fusion_imu_uncertainty_floor_deg: 2.0
    measurement_fusion_depth_uncertainty_floor_deg: 0.25
    measurement_fusion_agreement_gate_sigma: 3.0
    measurement_fusion_minimum_agreement_gate_deg: 1.0
    measurement_fusion_maximum_agreement_gate_deg: 8.0
    measurement_fusion_minimum_dominance_ratio: 4.0

    # Preserve the previous two-second averaging interval at 400 Hz.
    measurement_imu_sample_count: 800
    measurement_imu_max_direction_rms_deg: 0.25
    measurement_imu_accel_min_mps2: 7.50
    measurement_imu_accel_max_mps2: 12.00

    # Accept only a sequence whose fitted height and normal are stable.
    measurement_stable_plane_frame_count: 30
    measurement_maximum_height_stddev_m: 0.004
    measurement_maximum_plane_normal_rms_deg: 0.25
    measurement_timeout_sec: 30.0

    # Image top is forward; image left is vehicle left.
    # Previous: X=[0.10, 2.50]m, Y=[-0.50, 0.50]m, output=100x240.
    x_min_m: 0.10
    x_max_m: 3.5
    y_min_m: -0.6
    y_max_m: 0.6
    meter_per_pixel: 0.01

    # output_width = round((y_max_m - y_min_m) / meter_per_pixel)
    # output_height = round((x_max_m - x_min_m) / meter_per_pixel)
    output_width: 120
    output_height: 340

    status_log_interval_sec: 5.0
    startup_timeout_sec: 5.0
